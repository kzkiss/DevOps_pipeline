name: Lightweight Devops CI pipeline

on:
  push:  
    branches: [ "main"]

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug project structure
        run: |
          pwd
          ls -R
          python -c "import sys; print(sys.path)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'      

      - name: Install Python dependencies
        working-directory: ./app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Debug Python environment
        working-directory: ./app
        run: |
          python -c "import os; print('cwd=', os.getcwd())"
          python -c "import sys; print('\n'.join(sys.path))"
          python -c "import importlib.util; print(importlib.util.find_spec('main'))"

      - name: Run automated tests
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE/app
          pytest -v app/tests

      - name: Build Docker image
        run: |
          docker build -t lightweight-devops-pipeline .

      - name: Deploy application
        run: |
          docker compose up --build -d
        
      - name: Show running containers
        run: |
          docker ps -a

      - name: Show container logs
        run: |
          docker compose logs

     
      - name: Wait for container
        run: |
          sleep 5

      - name: Show running containers
        run: |
          docker ps -a
      
      - name: Show application logs
        run: |
          docker logs lightweight-backend-api

      - name: Test health endpoint
        run: |
          curl -v http://127.0.0.1:8000/health

      - name: Verify deployment
        run: |
          docker exec lightweight-backend-api python -c "
          import urllib.request
          print (urllib.request.urlopen('http://localhost:8000/health').read())
          "