name: Lightweight Devops CI pipeline

on:
  push:  
    branches: [ "main"]
  
  pull_request:
    branches: [ "main" ]

permissions:
      id-token: write
      contents: read

jobs:
  CI:
    runs-on: ubuntu-latest

    env:
      ECR_REPOSITORY: lw-devops-pipeline
      IMAGE_TAG: ${{ github.sha }}
      AWS_REGION: eu-west-2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'      

      - name: Install Python dependencies
        working-directory: ./app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run code quality checks
        run: |
          ruff check app
      
      - name: Run security checks
        run: |
          bandit -r app/ -x app/tests/

      - name: Run automated tests
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE/app
          pytest --cov=app --cov-report=term-missing app/tests

      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build -t lightweight-devops-pipeline:${{ env.IMAGE_TAG }} .

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag \
            lightweight-devops-pipeline:${{ env.IMAGE_TAG }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Push Docker image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Deploy to AWS EC2 via SSM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws ssm send-command \
            --instance-ids ${{ vars.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Deploying lightweight-devops-pipeline" \
            --parameters 'commands=[
              "aws ecr get-login-password --region eu-west-2 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}",
              "docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}",
              "CURRENT=$(cat /opt/current_version 2>/dev/null || echo '')",
              "echo $CURRENT | sudo tee /opt/previous_version",
              "docker stop lightweight-backend-api || true",
              "docker rm lightweight-backend-api || true",
              "docker run -d --name lightweight-backend-api -p 8000:8000 ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}",
              "echo ${{ env.IMAGE_TAG }} | sudo tee /opt/current_version"
            ]'
            

      - name: Verify Deployment smoke test
        id: smoke_test
        continue-on-error: true
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ vars.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["curl --fail http://localhost:8000/health"]' \
            --region ${{ env.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text)
          
          echo "Smoke test command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ vars.EC2_INSTANCE_ID }} \
            --region ${{ env.AWS_REGION }} || true
          
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ vars.EC2_INSTANCE_ID }} \
            --region ${{ env.AWS_REGION }} \
            --query "Status" \
            --output text)

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ vars.EC2_INSTANCE_ID }} \
            --region ${{ env.AWS_REGION }} \
            --query "StandardOutputContent" \
            --output text)

          ERROR=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ vars.EC2_INSTANCE_ID }} \
            --region ${{ env.AWS_REGION }} \
            --query "StandardErrorContent" \
            --output text)

          echo "--------------------------------"
          echo "Smoke test status: $STATUS"
          echo "Smoke test response:"
          echo "$OUTPUT"

          if [ "$STATUS" != "Success" ]; then
            echo "Smoke test error:"
            echo "$ERROR"
            echo "Smoke test failed! Deployment unsuccessful."
            exit 1
          fi

          echo "Smoke test passed! Deployment successful."
          echo "--------------------------------"

      - name: Rollback on failed smoke test
        if: steps.smoke_test.outcome == 'failure'
        run: |
          echo "Deployment failed due to failed smoke test."
          echo "Initiating automaticrollback..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ vars.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo /opt/rollback.sh"]' \
            --region ${{ env.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text)

          echo "Rollback command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ vars.EC2_INSTANCE_ID }} \
            --region ${{ env.AWS_REGION }} || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ vars.EC2_INSTANCE_ID }} \
            --region ${{ env.AWS_REGION }} \
            --query "Status" \
            --output text)

          echo " Rollback status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "Automatic rollback failed! Please check the EC2 instance for issues."
            exit 1
          fi

      - name: Verify Rollback
        if: steps.smoke_test.outcome == 'failure'
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ vars.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["curl --fail http://localhost:8000/health"]' \
            --region ${{ env.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ vars.EC2_INSTANCE_ID }} \
            --region ${{ env.AWS_REGION }} || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ vars.EC2_INSTANCE_ID }} \
            --region ${{ env.AWS_REGION }} \
            --query "Status" \
            --output text)

          echo "Verifying rollback status: $STATUS"  

          if [ "$STATUS" != "Success" ]; then
            echo "Rollback verification failed! Please check the EC2 instance for issues."
            exit 1
          fi

          echo "Rollback successful! The application has been reverted to the previous stable version."

      - name: Functional Test
        run: |
          echo "run,total,result" > func_test_result.csv

          for i in {1..30}; do
              echo "=== Run $i ==="
              start_time=$(date +%s%N)

              pytest app/tests/test_api.py \
                  --durations=0 \
                  --durations-min=0 \
                  > "pytest_run_$i.txt" 2>&1

              exit_code=$?

              end_time=$(date +%s%N)
              total=$(( (end_time - start_time) /1000000))

              if [ $exit_code -eq 0 ]; then
                  result="PASS"
              else
                  result="FAIL"
              fi

              echo "$i,$total,$result" >> func_test_result.csv

              cat "pytest_run_$i.txt"

          done